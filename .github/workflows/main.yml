name: Build APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|Could not|Unresolved|AAPT" -A4 build.log | head -80 > errors.txt || true
          cat errors.txt
          { echo '## BUILD ERRORS'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - run: cp app/build/outputs/apk/debug/app-debug.apk OpenTVRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTVRemote-apk
          path: OpenTVRemote.apk
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenTVRemote.apk
          generate_release_notes: true
